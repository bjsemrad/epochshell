# EpochShell theme: matte-black-red
#
# matte-black with a red accent. Everything else -- the neutral grey ladder, the text, the warning
# and error colours -- is inherited unchanged, so this is the same theme wearing a different accent,
# as matte-black-blue is.
#
# The red is One Dark's #e06c75, chosen to match the niri window border, so the focused window and
# the shell's lit controls are one colour. It is also matte-black's error colour, so a lit switch and
# a failed password are now drawn identically -- the same trade dark-red makes, taken further. Worth
# it for a desktop that reads as one red; a separate error colour can come back if that ever
# confuses.
#
# 5.86 against the ground: past 4.5 for the background-coloured text drawn on an accent fill, though
# lighter on a bar than matte-black-blue's 7.15.

extends = "matte-black"

accent = "#e06c75"
