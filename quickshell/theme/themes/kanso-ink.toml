# EpochShell theme: kanso-ink
#
# Kanso's middle dark variant, from kanso.nvim, on matte-black's ground (#121212) in place of
# kanso's own #14171d, as kanso-zen does. Every hue and the accent are the same as kanso-zen; what
# sets ink apart is its lighter ladder above the ground.
#
# The accent is the palette's `blue` (#7fb4ca), as in kanso-zen: 8.28 against this ground.
#
# `surfaceContainer` is inkBg3 rather than inkBg2. inkBg2 sits only 1.23 above this ground, which
# is too faint to read as a hover; inkBg3, at 1.68, is what kanso itself draws a selected item with
# (its visual selection and popup-menu selection). The two above it step up the same ramp: inkBg4,
# then gray5.
#
# Text is kanso's fg unchanged at 11.2. `outline` is gray3 (6.08), as in kanso-zen.

background = "#121212"
surface = "#1f1f26"
surfaceVariant = "#4b4e57"
surfaceContainer = "#393b44"
surfaceContainerHigh = "#4b4e57"
surfaceContainerHighest = "#5c6066"
surfaceText = "#c5c9c7"
outline = "#909398"

accent = "#7fb4ca"

purple = "#a292a3"
green = "#8a9a7b"
orange = "#b6927b"
blue = "#7fb4ca"
yellow = "#c4b28a"
cyan = "#8ea4a2"
red = "#c4746e"
bg_blue = "#8ea4a2"
bg_yellow = "#c4b28a"
