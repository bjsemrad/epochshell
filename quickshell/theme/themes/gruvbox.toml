# EpochShell theme: gruvbox
#
# The warm one. Everything else here is cool-toned -- near-black blues and grey text -- so this is
# the theme that proves nothing in the shell assumes a cold ground: brown-grey surfaces, cream
# text, and the retro accent set gruvbox is known for.
#
# Surfaces follow gruvbox's own bg0..bg3 ramp, with bg0_hard as the ground so the bar reads as
# darker than the panels sitting on it, the same relationship the default dark theme has.

background = "#1d2021"
surface = "#282828"
surfaceVariant = "#504945"
surfaceContainer = "#282828"
surfaceContainerHigh = "#3c3836"
surfaceContainerHighest = "#504945"
surfaceText = "#ebdbb2"
outline = "#a89984"

# Blue-aqua rather than the orange gruvbox is better known for: orange is already spoken for by
# night mode, and an accent that matches the "screen is warmed" indicator makes that indicator
# say nothing.
accent = "#83a598"

purple = "#d3869b"
green = "#b8bb26"
orange = "#fe8019"
blue = "#83a598"
yellow = "#fabd2f"
cyan = "#8ec07c"
red = "#fb4934"
bg_blue = "#83a598"
bg_yellow = "#fabd2f"
