# EpochShell theme: gruvbox
#
# The warm one. Everything else here is cool-toned -- near-black blues and grey text -- so this is
# the theme that proves nothing in the shell assumes a cold ground: brown-grey surfaces, cream
# text, and the retro accent set gruvbox is known for.
#
# This is gruvbox *medium*, the palette's default: bg0 as the ground, with bg1 and bg2 as the steps
# above it. `gruvbox-hard` is the same palette on bg0_h and is nothing but a deeper ground -- which
# is exactly what "hard contrast" means in gruvbox, since every step gains against it.

background = "#282828"
surface = "#3c3836"
surfaceVariant = "#504945"
surfaceContainer = "#3c3836"
surfaceContainerHigh = "#504945"
surfaceContainerHighest = "#665c54"
surfaceText = "#ebdbb2"
outline = "#a89984"

# Blue-aqua rather than the orange gruvbox is better known for: orange is already spoken for by
# night mode, and an accent that matches the "screen is warmed" indicator makes that indicator
# say nothing. This is also the palette's only blue -- muted and grey-green rather than saturated.
accent = "#83a598"

purple = "#d3869b"
green = "#b8bb26"
orange = "#fe8019"
blue = "#83a598"
yellow = "#fabd2f"
cyan = "#8ec07c"
red = "#fb4934"
bg_blue = "#83a598"
bg_yellow = "#fabd2f"
