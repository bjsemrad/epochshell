# EpochShell theme: dark-deep
#
# `dark` on a deeper ground: the same One Dark palette, the same muted text and vivid accent,
# sitting on #070506 instead of #0e1013. About two and a half times darker.
#
# The surfaces come down with it. Dropping only the ground would have raised every card 6.7% further
# above it -- surface from 1.21 to 1.29, and so on up the ramp -- so the theme would have been doing
# two things at once: deepening the ground and lifting the cards off it. These values put each step
# back on the ratio it has in `dark`, which makes this purely a change of ground.
#
# Text and the accent are left alone. They gain the same 6.7%, but there the extra contrast is worth
# having rather than something to undo.
#
# The borrowed ground is nominally pink -- hue 330, taken from ghost-pastel -- but at R7 G5 B6 the
# channels are two steps apart out of 255, so what arrives is black. The tint does real work in
# ghost-pastel, where the whole palette is lavender and the ground agrees with it; here it is simply
# the darkest this shell goes.

extends = "dark"

background = "#070506"

surface = "#1a1d23"
surfaceVariant = "#2e323c"
surfaceContainer = "#1a1d23"
surfaceContainerHigh = "#24282f"
surfaceContainerHighest = "#2c323a"
