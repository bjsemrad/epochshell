# EpochShell theme: matte-black
#
# A true matte black -- #121212, no blue in it at all -- with a single amber accent and a grey text
# The grey ladder, unchanged. One Dark's own base (#282c34) is blue-tinted, which is the
# one thing this theme exists to avoid -- so the ladder stays neutral and only the hues
# below come from One Dark.
background = "#121212"
surface = "#1e1e1e"
surfaceVariant = "#333333"
surfaceContainer = "#2a2a2a"
surfaceContainerHigh = "#333333"
surfaceContainerHighest = "#555555"
surfaceText = "#bebebe"
outline = "#8a8a8a"

# `selection` is what surfaceContainer draws, which is exactly the job the name promises: it is the
# hover and selected-row ground. It also has to be the one that carries -- lighter_background sits
# only 1.12 above this ground, which is under the point a hover is visible on a matte black, while
# selection gives 1.31.

accent = "#61afef"

# Warnings and errors stay apart, and One Dark makes this easy: it ships a real amber
# (#d19a66) distinct from its red, so night mode and a failed password can no longer be
# confused. No substitution needed here -- unlike the original palette, which had to
# borrow its second amber to keep the two roles apart.
orange = "#d19a66"
red = "#e06c75"

# `green` is drawn in the theme picker's swatch row and nowhere else. One Dark has an
# actual green, so the swatch row now shows a real spread instead of two ambers side by
# side. This is the one slot the swap straightforwardly improves.
green = "#98c379"

# Decorative only -- the shell reads none of these today. Now faithful to One Dark rather
# than to a palette that had no hue in these slots to give.
purple = "#c678dd"
blue = "#61afef"
yellow = "#e5c07b"
cyan = "#56b6c2"
bg_blue = "#3d6b94"
bg_yellow = "#8a6a3c"
