# EpochShell theme: matte-black
#
# A true matte black -- #121212, no blue in it at all -- with a single amber accent and a grey text
# ramp. The darkest-feeling theme here even though kanagawa-dragon's ground is numerically lower:
# dragon is warm-black, dark-deep is near-black with a red cast, and this one is dead neutral, so
# nothing on it reads as tinted and the amber is the only colour on screen.
#
# The source palette is a terminal palette, where `green`, `blue` and `orange` name ANSI slots
# rather than colours -- its `green` is amber, its `blue` is the accent orange, its `cyan` is grey.
# The shell reads those keys as roles instead, so they are mapped by what each one has to *do*
# rather than by the name it arrived under. Where that changes something, it is noted below.

# The grey ladder, taken straight from the palette: background, lighter_background, selection,
# muted, dark_foreground. Five real tones, so nothing here is invented.
background = "#121212"
surface = "#1e1e1e"
surfaceVariant = "#333333"
surfaceContainer = "#2a2a2a"
surfaceContainerHigh = "#333333"
surfaceContainerHighest = "#555555"
surfaceText = "#bebebe"
outline = "#8a8a8d"

# `selection` is what surfaceContainer draws, which is exactly the job the name promises: it is the
# hover and selected-row ground. It also has to be the one that carries -- lighter_background sits
# only 1.12 above this ground, which is under the point a hover is visible on a matte black, while
# selection gives 1.31.

accent = "#e68e0d"

# Warnings and errors have to stay apart: `orange` marks night mode and three degraded states, while
# `red` marks polkit failures and urgent notifications in nineteen places. The palette's own
# `orange` is #c63d3d, a brick red a hair off its `red` -- slot-faithful, but it would make a warmed
# screen and a failed password the same colour. bright_blue is the palette's other amber and is what
# the role actually wants: warm, clearly not an error, and a step brighter than the accent.
orange = "#f59e0b"
red = "#D35F5F"

# `green` is drawn in the theme picker's swatch row and nowhere else. Kept as the palette has it,
# which does mean the swatch shows two ambers side by side -- correct for a palette with no green in
# it, and the honest preview of what this theme looks like.
green = "#FFC107"

# Decorative only -- the shell reads none of these today. Left as the palette defines them so the
# file stays a faithful record of it.
purple = "#D35F5F"
blue = "#e68e0d"
yellow = "#b91c1c"
cyan = "#bebebe"
bg_blue = "#f59e0b"
bg_yellow = "#FFC107"
