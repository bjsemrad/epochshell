# EpochShell theme: dark-orange
#
# `dark` with a orange accent. Everything else -- the near-black ground, the muted text, the named
# colours -- is inherited from it, so this file holds the one line that differs and a colour fixed
# in dark is fixed here too.
#
# Shares its colour with the night-mode indicator, so a warmed screen no longer stands out from the switches.

extends = "dark"

accent = "#cc9057"
