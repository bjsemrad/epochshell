# The lock screen's password check: the user's own password and nothing else.
#
# Deliberately not the system's login or hyprlock stack. Those try pam_fprintd first, and PAM runs
# a stack in order, so a typed password would wait out the fingerprint reader's timeout before it
# was even looked at. The lock screen runs the fingerprint reader separately, in parallel.
#
# A bare module name resolves against the libpam quickshell was built with, which ships pam_unix.
# Checking a password as a normal user goes through the setuid unix_chkpwd helper.
auth required pam_unix.so
